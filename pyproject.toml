[project]
name = "uga-ai-research-is-awesome"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Daniel Redder", email = "daniel@redder.dev" }]
requires-python = ">=3.12"
dependencies = [
    "mkdocs>=1.5.3",
    "mkdocs-terminal>=4.8.0",
    "networkx>=3.1",
    "numpy>=1.26.0",
    "pandas>=2.1.1",
    "pytest>=7.4.0",
    "pyvis>=0.3.2",
    "requests>=2.31.0",
    "responses>=0.23.0",
    "scikit-learn>=1.3.1",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
uga-ai-research-is-awesome = "uga_ai_research_is_awesome:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.1",
    "pytest>=9.2.0",
    "responses>=0.26.3",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["site", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# This module embeds HTML and JavaScript whose line lengths are not Python formatting issues.
"src/graph_builder.py" = ["E501"]
