[project]
name = "uga-ai-research-is-awesome"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Redder", email = "daniel@redder.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "mkdocs>=1.5.3",
    "mkdocs-terminal>=4.8.0",
    "networkx>=3.1",
    "numpy>=1.26.0",
    "pandas>=2.1.1",
    "pytest>=7.4.0",
    "pyvis>=0.3.2",
    "requests>=2.31.0",
    "responses>=0.23.0",
    "scikit-learn>=1.3.1",
]

[project.scripts]
uga-ai-research-is-awesome = "uga_ai_research_is_awesome:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.1",
    "pytest>=9.2.0",
    "responses>=0.26.3",
]

