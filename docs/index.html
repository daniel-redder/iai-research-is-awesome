<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAI Research Relationships</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        #app { width: 100%; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 10; pointer-events: none;}
        h1 { margin: 0 0 10px 0; font-size: 18px; color: #202124; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 14px; color: #5f6368;}
        .color-box { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>IAI Research Topology</h1>
        <div class="legend-item"><div class="color-box" style="background: #1a73e8;"></div> IAI Core Faculty</div>
        <div class="legend-item"><div class="color-box" style="background: #1e8e3e;"></div> IAI Affiliate</div>
        <div class="legend-item"><div class="color-box" style="background: #d93025;"></div> Research Papers</div>
        <div class="legend-item"><div class="color-box" style="background: #9aa0a6;"></div> Uncertain / Co-authors</div>
    </div>
    <div id="app"></div>

    <!-- Import Cosmograph -->
    <script src="https://cdn.jsdelivr.net/npm/@cosmograph/cosmograph@1.3.0/dist/cosmograph.min.js"></script>
    <script>
        fetch('graph_data.json')
            .then(res => res.json())
            .then(data => {
                const canvas = document.createElement('canvas');
                document.getElementById('app').appendChild(canvas);
                
                const graph = new Cosmograph(canvas, {
                    nodes: data.nodes,
                    links: data.links,
                    nodeColor: n => n.color,
                    nodeSize: n => n.size,
                    nodeLabelAccessor: n => n.label,
                    linkWidth: 1.5,
                    linkColor: l => l.type === 'cited' ? 'rgba(217, 48, 37, 0.4)' : 'rgba(154, 160, 166, 0.6)',
                    linkArrows: l => l.type === 'cited',
                    simulationGravity: 0.25,
                    simulationRepulsion: 1.5,
                    hoveredNodeRingColor: '#202124',
                    fitViewOnInit: true
                });
            });
    </script>
</body>
</html>
