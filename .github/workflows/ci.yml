name: CI/CD Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: uv sync

      - name: Generate Temporal Toy Data
        # Simulates the existence of historical data and newly harvested daily data
        run: uv run python tests/generate_toy_data.py

      - name: Execute Incremental Clustering Engine
        # Respects old clusters, assigns close matches, spawns/names new clusters
        run: uv run python src/cluster_papers.py

      - name: Build Interactive Vis.js App
        # Injects the finalized data into the standalone HTML app
        run: uv run python src/graph_builder.py

      - name: Build Documentation (Strict Mode)
        # Fails CI if themes, assets (IAI logo), or HTML embeds are missing
        run: uv run mkdocs build --strict