name: Daily Repository Update

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-papers:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --group dev

      - name: Run Harvester
        env:
          POLITE_EMAIL: ${{ secrets.POLITE_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: uv run python src/harvester.py

      - name: Run Author Resolver
        run: uv run python src/author_resolver.py

      - name: Run Clustering
        run: uv run python src/clusterer.py

      - name: Build Graph
        run: uv run python src/graph_builder.py

      - name: Build Documentation
        run: uv run mkdocs build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit and Push Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ docs/ README.md
          git diff --cached --quiet || git commit -m "Daily update: expanded paper horizon"
          git push
